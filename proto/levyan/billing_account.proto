edition = "2023";

package levyan;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/levyan";

// BillingAccount is what an account of roster's pays with: one card and one
// invoice -- who receives it, and the business it is billed to -- in one
// country, on the channel and in the currency the deployment sold that
// country on when it was made (`payers.channels`, #4). An account may hold
// several (one for the company, one of its own), and a workspace is paid for
// with one of them at a time (`Link`).
//
// It is the account's, and no product's: global. What reads it is the
// account's own calls (`levyan.v1.PayerService`), which read only the billing
// accounts it owns (`pd.AccountReads`), and the deployment's work; the
// generated methods are nobody's (`server/policy`).
//
// Its country, its channel and its currency never change, not even when the
// deployment comes to sell that country through another: billed elsewhere or
// otherwise is another billing account, and a workspace moves to it at a
// period's end, as any change of who pays does. The card itself is the
// channel's to keep, and comes with the channel's adapter (#10, #12).
//
// What says who a person is, is declared `personal`. When roster has nobody by
// the account any more, those fields are replaced (`date_forgotten`) and the
// row stays, with the business it billed, which is the record tax law keeps.
message BillingAccount {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // What its owner calls it: "회사용".
  string name = 5 [(payday.field) = {personal: true}];

  // The account it is of: roster's, by its identifier.
  bytes owner = 8 [
    (orm.field) = {
      type: TYPE_UUID
      immutable: true
    },
    (payday.field) = {personal: false}
  ];

  // The country it is billed in, ISO 3166-1 alpha-2 in capitals: KR.
  string country = 9 [
    (orm.field) = {immutable: true},
    (payday.field) = {personal: false}
  ];

  // The channel it is sold through, by its name (`CHANNEL_MOR`), and the
  // currency a statement on it is priced in: what the deployment said of its
  // country when it was made (`payers.channels`; by default the merchant of
  // record, in won for KR and in US dollars for every other). Both are the
  // server's to say. A name and not the enum, for the reason `Tenant.channel`
  // is one.
  string channel = 10 [
    (orm.field) = {immutable: true},
    (payday.field) = {personal: false}
  ];
  string currency = 11 [
    (orm.field) = {immutable: true},
    (payday.field) = {personal: false}
  ];

  // Who receives what it is billed: a person's name, where it goes, and the
  // address it is billed at.
  string recipient = 12 [(payday.field) = {personal: true}];
  string email = 16 [(payday.field) = {personal: true}];
  string address = 17 [(payday.field) = {personal: true}];

  // The business it is billed to, for a tax invoice; unset for a person.
  BillingBusiness business = 18 [
    (orm.field) = {nullable: true},
    (payday.field) = {personal: true}
  ];

  // When what says who its owner is was replaced, roster having nobody by
  // them any more; unset while it has.
  google.protobuf.Timestamp date_forgotten = 19 [(orm.field) = {nullable: true}];

  // Whether what it is billed can be collected now, and why not, and since
  // when it has been so: what the subscription it is collected through says,
  // on the merchant of record's channel (`Subscription`, #12). Written beside
  // the mirror whenever it moves, and by nothing else, so that each change of
  // it is on the trail. Unspecified on every other channel -- a Korean PG,
  // bank transfers -- whose collection is no subscription's, and on the
  // MoR's until a subscription is first mirrored, which is read as no
  // subscription since it was made.
  CollectionState collection = 20;
  google.protobuf.Timestamp date_collection = 21 [(orm.field) = {nullable: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];

  // Never stamped: there is no Erase. A billing account somebody was billed
  // with is kept, for as long as what it was billed is.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {
      crud: true
      erase: {disabled: true}
    }
    indexes: [
      {
        name: "page"
        refs: [
          {
            name: "date_created"
            number: 15
          },
          {
            name: "id"
            number: 1
          }
        ]
      },
      {
        // An account's billing accounts, in the order it made them.
        name: "owner"
        refs: [
          {
            name: "owner"
            number: 8
          },
          {
            name: "date_created"
            number: 15
          },
          {
            name: "id"
            number: 1
          }
        ]
      }
    ]
  };
  option (payday.entity) = {
    domain: 19
    global: {}
    list: {
      order: [
        {field: {name: "date_created"}},
        {field: {name: "id"}}
      ]
      by: [
        {name: "ref"},
        {name: "owner"}
      ]
      size: 50
      max: 200
    }
  };
}

// CollectionState is whether what a billing account is billed can be
// collected now, and why not.
//
// What a state that is not collectable leads to -- a grace, a restriction --
// is dunning's (#11), and not said here.
enum CollectionState {
  // Nothing is said: a channel other than the merchant of record's, whose
  // collection is no subscription's.
  COLLECTION_STATE_UNSPECIFIED = 0;

  // Its subscription is billed and paid up, and takes a charge.
  COLLECTION_STATE_COLLECTABLE = 1;

  // It has no subscription: the payer has not finished a checkout.
  COLLECTION_STATE_NO_SUBSCRIPTION = 2;

  // A payment the MoR has not collected, which it is retrying: nothing more
  // is charged until it is paid.
  COLLECTION_STATE_PAST_DUE = 3;

  // Its subscription is paused, and billed nothing.
  COLLECTION_STATE_PAUSED = 4;

  // Its subscription is over -- canceled at the MoR, by levyan or by the
  // payer -- and charges nothing again: another checkout begins another.
  COLLECTION_STATE_CANCELED = 5;

  // A payment waits for the payer to act -- approve it in their card
  // company's app, or pass their bank's check -- before the MoR can collect
  // it.
  COLLECTION_STATE_NEEDS_ACTION = 6;
}

// BillingBusiness is the business a billing account is billed to: what a Korean
// tax invoice names it by.
message BillingBusiness {
  // Its registration number: 123-45-67890.
  string registration = 1;

  // Its name, and who represents it.
  string name = 2;
  string representative = 3;

  // Where it does business.
  string address = 4;

  // What it does: its kind (업태) and its item (종목).
  string kind = 5;
  string item = 6;

  // Where its tax invoices go.
  string email = 7;
}
