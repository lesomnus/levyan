# What every process in the pod is told (`--config`), beside what is secret,
# which is in the Secrets README.md names. A LEVYAN_* variable beats what is
# written here. An overlay replaces this file with its own, starting from this
# one.

db:
  driver: pgx
  # dsn: LEVYAN_DB_DSN, from the Secret `levyan`.
  #
  # The init container brings the tables along (`levyan migrate`) before the
  # pod serves; what serves only checks them.
  migrate: false

server:
  # What products call, with their keys: gRPC, which the NetworkPolicy lets
  # through and an overlay narrows to the products.
  addr: ":50051"

# Two processes in the pod, the server and the operator's entry point, so the
# database is where they meet: each loop runs in one of them.
watch:
  broker: postgres
spin:
  lease: postgres

# The roster whose accounts pay (#4): every call an account makes, relayed by
# a product, is held to what roster says of it now, and with no roster named
# none is served. The key is levyan's at roster, in the Secret
# `levyan-roster`, which the base mounts where this names it (README.md); its
# role holds roster's `standing.Methods`.
#
# auth:
#   roster:
#     addr: "roster:50051"
#     key: "${file:/run/secrets/levyan-roster/key}"
#     directory: loft

# The merchant of record (#12): Paddle, with its key and its webhook secret
# in the Secret `levyan-paddle`, which the base mounts where this names them
# (README.md). Without the block there is none, and nothing is received or
# pulled. Webhooks come to the second listener, which an overlay opens
# (`server.http.addr`) and lets Paddle reach; a deployment Paddle cannot
# reach names no webhook secret, and reads Paddle's events alone.
#
# mor:
#   kind: paddle
#   environment: sandbox
#   api_key: "${file:/run/secrets/levyan-paddle/api_key}"
#   webhook_secret: "${file:/run/secrets/levyan-paddle/webhook_secret}"
#   client_token: "test_…"
#   plans: {KRW: "pri_…", USD: "pri_…"}
#
# And with it, when collection on the merchant's channel begins: what ended
# before is the shadow billing's, and is never charged.
#
# invoices:
#   mor:
#     live_from: "2026-12-01T00:00:00+09:00"

# The trail digests every row it records with this key, so that a row written
# past the servers is found (`levyan trail rows`). Keep it with the backups,
# apart from the database's.
#
# How long the trail keeps a row is not said here: with no window it is kept
# whole, which suits a record of money until the deployment decides its
# retention (levyan.yaml says what each setting means).
audit:
  digest:
    key: /run/secrets/levyan/digest.key

# The operator's entry point (`levyan-admin serve`): every interface of the pod,
# so that the probe beside it can reach it, and nothing over the network, which
# the NetworkPolicy refuses. A file per operator in the Secret `levyan-admin`.
admin:
  addr: 0.0.0.0:8081
  keys:
    operator: "${file:/run/secrets/levyan-admin/operator}"

