# What this deployment is configured with.
#
# A file, then the environment over the top of it: `LEVYAN_DB_DSN` beats what
# is written here. `levyan config` prints what came out, and
# `levyan config env` lists every variable there is.

db:
  driver: sqlite3
  dsn: "file:levyan.db?_pragma=foreign_keys(1)"

server:
  # What products call: gRPC, with a service key (`levyan-admin key issue`).
  addr: ":50051"

  # A second listener, for a caller that speaks Connect rather than gRPC --
  # curl, while developing. The same server behind the same interceptors and
  # the same wall; levyan has no page, so no origin is named.
  #
  # http:
  #   addr: ":8080"
  #   allow_web: true

watch:
  # Named rather than defaulted, and it is the one field this app is refused for
  # leaving out. `memory` publishes inside this process, which is right for one
  # replica and silently wrong for two -- a client watching against one never
  # hears about a write that landed on another, and nothing reports it.
  #
  # And never `none`: what products are granted is streamed to them
  # (`payday.GrantService`), from the outbox every grant's change is written to
  # and through this broker, which the loop `payday.outbox` publishes to.
  broker: memory

spin:
  # Named for the same reason: which process of the deployment runs the loops
  # only one of them may -- the sweeps, the outbox drain. `local` runs them all
  # in this process, which is right for one replica and silently wrong for two:
  # each would run every sweep. `postgres` (config/leasepg) holds them across
  # processes on the app's own database; `none` runs none of them here.
  lease: local

# What is expected of the readings products send. A workspace that has been
# sending readings of a stock meter within `recent` and has sent none for
# longer than `gap` is warned of, in the log and in the gauge
# `levyan.readings.gaps`, by a loop that looks `every` so often
# (`levyan.readings.gaps`; `levyan-admin gap ls` asks the same now). It is the
# warning and nothing else: how long a reading speaks for when no later one
# comes is the rating's, and not a number here.
#
# readings:
#   gap: 36h
#   recent: 168h
#   every: 1h

# When a product's periods are closed. A period -- a calendar month in the
# product's zone (`levyan-admin product configure`) -- is closed by the loop
# `levyan.periods.close`, looking `every` so often, once it has ended and
# waited out `grace` for what comes late; what comes later still is kept and
# corrected on a later statement. An operator closes one by hand without the
# grace (`levyan-admin period close`).
#
# periods:
#   grace: 48h
#   every: 1h

# What products' workspaces are granted (`server/grants`). A grant with no end
# of its own reaches `horizon` from its last renewal, and the loop
# `levyan.grants.renew`, every `renew`, renews each once less than half of that
# is left -- so a product that stops hearing from levyan keeps it for half a
# horizon at least and a whole one at most -- gives and ends what the rules
# want, and takes out of every list what has been over for two days.
#
# grants:
#   horizon: 168h
#   renew: 1h

# What levyan keeps, held to what its channels answer and to itself (#13):
# the loop `levyan.reconcile`, `every` so often, reads what the merchant of
# record billed that changed within `window`, and what it gave or took back
# within it, a refund or a chargeback, and holds the payment ledger to that
# -- and invoices to their attempts, credit to its rows, statements to
# their invoices, grants to their rules -- and finds what is left where it
# should have moved on for longer than `stale` says. Each finding is written
# once, said in the log and in the gauge `levyan.reconcile.findings`, and
# left to an operator (`levyan-admin reconcile`): a pass changes no money.
#
# reconcile:
#   every: 24h
#   window: 168h
#   stale:
#     unknown: 1h
#     pending: 72h
#     period: 24h
#     draft: 24h
#     statement: 24h
#     notice: 1h
#     mirror: 168h

# The keys a billing key is sealed under before it is written
# (`internal/keyring`): a PG's key to a payer's card, which with levyan's own
# key charges it, kept so that a copy of the database charges nobody. Nothing
# stores one yet (#4), and with no block here there is no keyring.
#
# `kind` is where the keys are. `file` is each key 32 random bytes in a file
# of its own -- `head -c 32 /dev/urandom > key`, `chmod 400 key` -- held to
# PostgreSQL's rule for its server.key: this process's own file and nobody
# else's (0600 at most), or root's, which its group may read too (0640 at
# most), as a Kubernetes Secret mounted with `defaultMode: 0440` and an
# `fsGroup` is. Anybody else's, any other mode or another length is refused.
# `kms` is named and not built yet, and refused.
#
# Every key in `keys` opens what it sealed, by the id each sealed value
# carries, and `seal` is the one that seals. To rotate, each step on every
# process before the next: add the new key; make it `seal`; seal again what
# the old one sealed; take the old one out.
#
# billing_keys:
#   kind: file
#   keys:
#     - id: "2026-10"
#       file: /run/secrets/levyan/billing-2026-10.key
#   seal: "2026-10"

# The roster whose accounts pay (#4): asked whether an account a product
# relays a call for is in good standing, and heard saying when one is
# suspended or erased. With none, no call an account makes is served. The key
# is a secret: a deployment key (`rk_`, with the directory its accounts are
# in) or a tenant key of the directory (`rt_`), whose role holds roster's
# `standing.Methods` (roster's docs/relying-app.md).
#
# auth:
#   roster:
#     addr: "roster:50051"
#     key: "${file:/run/secrets/levyan-roster/key}"
#     directory: loft

# Who pays: how many of each payer's workspaces of a product have their
# allowances; how often an erased account is asked about again, and everybody.
# How long a workspace may go with no payer before it is restricted is the
# dunning table's row of it (`dunning.kinds.payerless`, below).
#
# `channels` is what a billing account is billed through, by the country it
# is in (ISO 3166-1 alpha-2, in capitals), and `default` for every country no
# other key names: the channel, MOR or PG_KR, and the currency. A key left
# out is as below. It is asked as a billing account is made and never again
# of it, so changing it moves no billing account made before; and a
# product's prices must be on each channel and currency it names, or what is
# billed there comes to nothing.
#
# payers:
#   free: 3
#   settle: 1h
#   reconcile: 24h
#   channels:
#     KR: {channel: MOR, currency: KRW}
#     default: {channel: MOR, currency: USD}

# What is done after a payment fails (#11): the policy table, a row for each
# kind of decline -- temporary, replace (a method to give anew), fraud, and
# other, which says no more -- and one for a workspace nobody pays for. A
# row's retries are spans from the invoice's first failed charge, each a new
# charge with a key of its own; its grace is from the same, after which what
# the invoice bills is restricted (`<product>.restricted`, or at once with
# `restrict: at_once`); and once no retry is left and the grace is over, the
# invoice is uncollectible, still owed and still restricted until it is paid.
# A billing account collectable again is charged at once, whatever its row
# schedules. What `other` leaves out is what `temporary` says. The values
# below are the defaults -- Claude's, provisional: the owner has not decided
# them (docs/design.md §17, 3) -- and a row left out is its default.
#
# dunning:
#   every: 1m
#   kinds:
#     temporary: {retries: [24h, 72h, 120h], grace: 168h, restrict: after_grace}
#     replace:   {retries: [], grace: 168h, restrict: after_grace}
#     fraud:     {retries: [], grace: 0s, restrict: at_once}
#     other:     {}
#     payerless: {grace: 720h, restrict: after_grace}

# The merchant of record a billing account on its channel is collected
# through (#12): Paddle. With no block there is none -- a checkout is refused,
# no webhook is received and no event pulled -- and nothing else changes.
#
# The key and the webhook secret are secrets, so references to them and never
# the values: the key one of the environment's (`pdl_sdbx_apikey_…` in the
# sandbox), with the permissions to read and write transactions,
# subscriptions and adjustments and to read notifications; the secret the
# notification destination's, which signs the webhooks Paddle sends to
# `POST /webhooks/mor/paddle` on the second listener (`server.http.addr`).
# With no webhook secret, no webhook is received, and Paddle's list of its
# events -- read every `pull` into the same inbox -- is all levyan hears.
#
# `plans` is the plan a checkout subscribes a billing account to, by the
# currency it is billed in: a monthly price of nothing, every amount being
# levyan's one-time charges. Every currency `payers.channels` bills on the
# merchant of record needs one.
#
# mor:
#   kind: paddle
#   environment: sandbox
#   api_key: "${file:/run/secrets/levyan-paddle/api_key}"
#   webhook_secret: "${file:/run/secrets/levyan-paddle/webhook_secret}"
#   client_token: "test_…"
#   plans:
#     KRW: "pri_…"
#     USD: "pri_…"
#   tolerance: 5s
#   pull: 1m
#
# With a merchant named, its channel is collected -- each invoice charged to
# its billing account's subscription -- from `invoices.mor.live_from` on,
# which is then required: an instant with its offset. A draft of a period
# that ended before it is the shadow billing's, closed as a shadow and never
# charged; one that ends at or after it is invoiced and charged. Say now or
# later: a draft gathered across an earlier time is a shadow whole.
#
# invoices:
#   mor:
#     live_from: "2026-12-01T00:00:00+09:00"

# The operator's entry point, which `levyan-admin serve` serves and `levyan
# serve` does not: on the loopback unless said otherwise, and never on an
# address the public reaches.
#
# Each operator by name, with the key they call with -- a secret, so a
# reference to one and never the key itself: `${file:/run/secrets/…}`, or
# `${env:…}` (32 characters or more; `openssl rand -hex 32` makes one). With
# none, `levyan-admin serve` stands nothing up.
#
# admin:
#   addr: "127.0.0.1:8081"
#   keys:
#     alice: "${file:/run/secrets/levyan-admin-alice}"

# How long the trail keeps a row. Every write this app makes is recorded, and
# **nothing else applies a window**: with no block here the table is kept whole,
# forever, and it is the one that grows without anybody writing to it.
#
# Left out rather than filled in, because a scaffold cannot know what this app
# is regulated as -- and a wrong number here is the mistake worth being loudest
# about, since it works: the sweep runs, the table stops growing, every graph
# improves, and what it is doing is destroying the evidence.
#
# `retain` is how long a row stays in the database and `destroy` is how long it
# exists at all, the archive holding it in between. Naming `retain` with nowhere
# for the rows to go is refused where this process comes up, unless
# `discard: true` says the deployment means to keep nothing. `archive` is a
# directory, and the store in it keeps each tenant's rows apart.
#
# `profile:` fills both from a named regime -- pci, hipaa, sox, pipa,
# pipa-sensitive, gdpr, forever -- and `trail.Profiles` carries the sentence
# each number comes from, so what is written here is arguable rather than
# arbitrary. Anything set beside a profile wins.
#
# `by:` is per kind of thing, keyed by what the schema registered. Obligations
# are not uniform: what was done to a person eventually has to stop existing,
# and what a machine did is an operating record with the opposite requirement.
#
# `min:` is the least this deployment keeps whatever a tenant's contract says,
# and is for an app whose tenants keep their history for different lengths of
# time. What a tenant keeps is the app's data rather than a setting, so it is
# answered in code, as `trail.Policy.Tenants`; this is the floor under it.
#
# `checkpoints:` is where every pass, and every act that changes the archive,
# leaves what the archive held, which the database's account of it is checked
# against. Kept apart from the archive on a disk that refuses deletion, and
# signed with a key mounted as a secret -- Ed25519, ECDSA or RSA, as `openssl
# genpkey` writes one -- they are what catches an archive somebody rewrote. An
# archive is refused without `key:`: there is no account of one that nothing
# signs, and no key everybody knows to fall back on. `init` writes one of this
# deployment's own beside the archive when none is named, for development. A key
# in a device is named here by its URI -- `pkcs11:` for an HSM, `tpm:`,
# `hashivault://`, `awskms://` -- once `cmd` imports what speaks to it,
# `config/signerpkcs11` and its siblings. The key signs every row of the account
# too, and `write_once` says the disk keeps what it is given, so that the
# process never erases a checkpoint either -- it is the disk's promise, and on
# an ordinary one it keeps nothing from whoever holds it.
#
# `witnesses:` hear every checkpoint outside the database and the archive, so
# that the newest is known to something whoever holds the two cannot reach: a
# verification finds a checkpoint a witness heard that the store no longer
# keeps, and the newest one if no witness heard it. `log:` tells the log and a
# gauge, `payday.trail.checkpoint`, which the monitoring alerts on when it goes
# down; `store:` and a directory keeps what it hears on a disk of its own, with
# credentials of its own, best one that refuses deletion. `cli` links both.
#
# `keys:` seals what the archive's rows say, a key per tenant, so that a tenant
# that leaves takes its trail out of the archive's backups as well. `master` is
# the public half of a key `age-keygen` made and is kept offline -- or a
# device's, through its age plugin (`age1yubikey1…`); a command that reads the
# trail is given the private half for one run, as `<APP>_AUDIT_KEYS_IDENTITY`,
# and the serving process never is.
#
# audit:
#   profile: pipa
#   archive: /var/lib/levyan/audit
#   checkpoints:
#     dir: /mnt/worm/levyan/checkpoints
#     write_once: true
#     key: /run/secrets/checkpoints.pem
#     witnesses: ["log:", "store:/mnt/witness/levyan"]
#   keys:
#     dir: /var/lib/levyan/audit-keys
#     master: age1…
#   min:
#     profile: pipa
#   by:
#     holder:
#       profile: gdpr
