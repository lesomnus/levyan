name: ci

on:
  push:
    branches: [main]
  pull_request:

# To read the checkout, and nothing else, unless a job says otherwise -- and
# one does, `image`, which runs on `main` alone. Said here rather than left to
# the repository's default, which is a setting nobody reviews.
permissions:
  contents: read

# Every job names its image rather than `ubuntu-latest`, so that the runner
# moves when this file says so and not on GitHub's schedule.
#
# And every action is named by the commit its version had when it was written
# here, with that version after it: a tag is moved by whoever can push to the
# action's repository, so a tag is code this file has never seen -- and
# `image` hands one of them the token that pushes. Renovate moves the commit
# and the comment together (`helpers:pinGitHubActionDigests`, in payday's
# preset).
jobs:
  go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache is the one below, not setup-go's: setup-go keys it by
          # go.sum alone, so whichever job finished first saved it.
          cache: false
      # What the `go` job compiled last time: every package and every test,
      # which is what the other jobs build a part of.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-
            go-${{ runner.os }}-
      - name: generated code matches the schema
        run: go tool pd gen --check .
      # The API an app calls levyan with, a module of its own that `pd gen`
      # leaves alone, generated by the buf the step above fetched: what its
      # .proto says, and requiring nothing of levyan's or of payday's.
      - name: the API's code matches its .proto
        run: scripts/api.sh --check
      - name: the API breaks nothing it promised
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${GITHUB_BASE_REF}"
          scripts/api.sh --breaking FETCH_HEAD
      # What would go wrong before it does: a layer that cannot join a
      # transaction, a field that may hold a person and says nothing, ...
      - name: what pd doctor says
        run: go tool pd doctor .
      - name: modules are tidy
        run: |
          go mod tidy -diff
          (cd api && go mod tidy -diff)
      - name: vet
        run: |
          go vet ./...
          (cd api && go vet ./...)
      - name: test on SQLite
        run: go test ./...
      # Saved by this job alone, the one that compiles all of it, for every
      # job of the next run to restore.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-${{ github.sha }}

  # The suite again, on the PostgreSQL a deployment runs, the official image
  # (pdtest.DB): every test makes a schema of its own and migrates it. A job of
  # its own beside `go` rather than a step after its SQLite run, since it needs
  # nothing that run makes.
  postgres:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Started first, so that it is up by the time the tests are built.
      - name: PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=levyan -e POSTGRES_PASSWORD=levyan -e POSTGRES_DB=levyan postgres:18
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # A cache of its own, beside the `go` job's: what it keeps of a run is
      # the tests' results on PostgreSQL. Until it has saved one, the `go`
      # job's has what is compiled.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-postgres-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-postgres-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-
            go-postgres-${{ runner.os }}-
            go-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-
            go-${{ runner.os }}-
      - name: PostgreSQL is up
        run: |
          for i in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U levyan && exit 0; sleep 1; done
          docker logs postgres; exit 1
      - name: test on PostgreSQL
        env:
          PDTEST_POSTGRES: postgres://levyan:levyan@localhost:5432/levyan?sslmode=disable
        run: go test ./...
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-postgres-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-${{ github.sha }}

  # A deployment with data in it, brought up to this build (scripts/upgrade.sh):
  # the build this one comes after -- the pull request's base, or what `main`
  # was before this push -- writes a product and its price book, a key, two
  # workspaces with payers, readings and points, closed periods, an invoice and
  # grants, and this one migrates them, on SQLite and on PostgreSQL, and reads
  # them back as they were. Every other test starts from an empty database,
  # which takes any column the schema adds; a column that may not be NULL and
  # has no default cannot be added to a table with rows in it, and only this
  # says so. `Workspace.label` (#25) was found by staging's migration instead,
  # and this job is Claude's answer to it (2026-10-31).
  #
  # And from the oldest build a deployment still runs, beside it: a migration
  # from the build just before is one step, and a deployment that skipped some
  # takes several at once. What a build from before a feature does not have,
  # it is not asked to write.
  upgrade:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Started first, so that it is up by the time levyan is built.
      - name: PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=levyan -e POSTGRES_PASSWORD=levyan -e POSTGRES_DB=levyan postgres:18
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The `go` job's cache, as the other jobs restore it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-
            go-${{ runner.os }}-
      - name: this build, the one it comes after, and the oldest a deployment runs
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The build staging runs, 8c7baa5 (#28). It moves when staging
          # moves: to what staging runs once it runs it.
          OLDEST: 8c7baa545e1a14161d0ac20d8ade7256bd98a89b
        run: |
          go build -o "${RUNNER_TEMP}/now/" ./cmd/levyan ./cmd/levyan-admin
          # old NAME COMMIT: the build at COMMIT, its binaries in $RUNNER_TEMP/NAME.
          old() {
            git worktree add --detach "${RUNNER_TEMP}/$1-src" "$2"
            (cd "${RUNNER_TEMP}/$1-src" && go build -o "${RUNNER_TEMP}/$1/" ./cmd/levyan ./cmd/levyan-admin)
          }
          old before "${BEFORE}"
          old oldest "${OLDEST}"
      - name: PostgreSQL is up
        run: |
          for _ in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U levyan && exit 0; sleep 1; done
          docker logs postgres; exit 1
      - name: what the build before made, migrated by this one
        env:
          UPGRADE_POSTGRES: postgres://levyan:levyan@localhost:5432/levyan_upgrade?sslmode=disable
        run: |
          docker exec postgres psql -U levyan -qc 'create database levyan_upgrade'
          scripts/upgrade.sh "${RUNNER_TEMP}/before" "${RUNNER_TEMP}/now"
      - name: what the oldest build a deployment runs made, migrated by this one
        env:
          UPGRADE_POSTGRES: postgres://levyan:levyan@localhost:5432/levyan_upgrade?sslmode=disable
        run: |
          # The step before made it, and wrote in it.
          docker exec postgres psql -U levyan -qc 'drop database levyan_upgrade' -c 'create database levyan_upgrade'
          scripts/upgrade.sh "${RUNNER_TEMP}/oldest" "${RUNNER_TEMP}/now"

  # What the Go vulnerability database says of the code this calls: a known
  # issue in a module, or in the standard library this is built with, that a
  # path from here reaches. Red the day one is published, which is when it is
  # worth knowing -- but for what `accepted` names, each with why.
  vuln:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-
            go-${{ runner.os }}-
      - name: govulncheck
        run: |
          # Nothing yet. An entry is an ID and a comment saying why it may wait.
          accepted=""

          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... > vuln.json || true
          # A finding whose trace reaches a function is one this code calls;
          # the rest are in a package or module it only has.
          called="$(jq -r 'select(.finding != null and .finding.trace[0].function != null) | .finding.osv' vuln.json | sort -u)"
          left="$(comm -23 <(printf '%s\n' "${called}" | sed '/^$/d') <(printf '%s\n' ${accepted} | sort -u))"
          if [ -n "${left}" ]; then
            echo "called, and not accepted:"
            printf '  %s\n' ${left}
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... || true
            exit 1
          fi
          echo "govulncheck: nothing called${accepted:+ but ${accepted}}"

  # The image, built on every run and asked what it is, so that a pull request
  # that breaks the build of what a deployment runs is red where it is
  # reviewed. Nothing is pushed here; `image` pushes.
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: docker build -t levyan:ci --build-arg VERSION=ci .
      - name: both binaries are in it, and say what they are
        run: |
          docker run --rm levyan:ci version
          docker run --rm --entrypoint /usr/local/bin/levyan-admin levyan:ci version
      # The reference deployment builds, and the file it hands every process is
      # one this build reads: a manifest or a setting that broke would
      # otherwise be found by the first deployment to apply it.
      - name: the reference deployment builds and its configuration is read
        run: |
          kubectl kustomize deploy/k8s > /dev/null
          d="$(mktemp -d)"
          mkdir -p "$d/levyan" "$d/levyan-admin"
          openssl rand -base64 32 > "$d/levyan/digest.key"
          openssl rand -hex 32 > "$d/levyan-admin/operator"
          chmod -R a+rX "$d"
          docker run --rm -e LEVYAN_DB_DSN=postgres://ci@127.0.0.1:1/ci -e HOST_IP=127.0.0.1 \
            -v "$PWD/deploy/k8s/config.yaml:/etc/levyan/levyan.yaml:ro" \
            -v "$d/levyan:/run/secrets/levyan:ro" -v "$d/levyan-admin:/run/secrets/levyan-admin:ro" \
            levyan:ci --config /etc/levyan/levyan.yaml config > /dev/null

  # The image, last, and only once everything above is green: what is in the
  # registry is what a deployment may run. Pushed from `main` alone, since a
  # branch that has not been merged is not that.
  #
  # `:edge` moves with `main`. The digest it says in the run's summary is what
  # a deployment pins, so that it changes when its repository says so and not
  # when somebody pushes here.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, postgres, upgrade, vuln, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # ghcr.io/lesomnus/levyan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The BuildKit that builds what is pushed, by its version and digest,
      # rather than the one the runner's Docker happens to carry that day: what
      # the builder is is part of what the image is made of, as the actions
      # are. Renovate moves it (`renovate.json`).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The source label is what links the package to this repository on
      # GHCR, and the commit is the one `levyan version` names beside `edge`.
      #
      # `:edge` only moves forward. Merges made one after another run side by
      # side and finish in any order, and the last to push would win: so a run
      # whose commit is behind the one `:edge` holds pushes nothing -- asked
      # right before the push, since the build takes minutes and a later run
      # may push meanwhile.
      - name: build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker buildx build --load -t ghcr.io/lesomnus/levyan:edge \
            --build-arg VERSION=edge \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} .
          held="$(docker buildx imagetools inspect ghcr.io/lesomnus/levyan:edge \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
          if [ -n "${held}" ] && [ "${held}" != "${GITHUB_SHA}" ]; then
            # Ahead, or diverged from a history rewritten, moves it; behind
            # does not. A compare that fails pushes.
            how="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${held}...${GITHUB_SHA}" --jq .status 2>/dev/null || echo unknown)"
            if [ "${how}" = "behind" ]; then
              echo "\`:edge\` holds ${held}, which ${GITHUB_SHA} is behind: nothing pushed" | tee -a "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi
          docker push ghcr.io/lesomnus/levyan:edge
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/lesomnus/levyan:edge)"
          echo "pushed \`${digest}\` (${{ github.sha }})" | tee -a "${GITHUB_STEP_SUMMARY}"
