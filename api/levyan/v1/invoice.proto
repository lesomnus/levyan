edition = "2023";

// What a billing account is asked to pay: its invoices, their lines, and the
// credit notes that take some of an invoice back -- and, to its payer, the
// statements its invoices' lines are.
package levyan.v1;

import "google/protobuf/timestamp.proto";
import "levyan/v1/billing.proto";
import "levyan/v1/price_book.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/levyan/api/levyan/v1;levyanv1";

message ListInvoicesRequest {
  // Of one of the account's billing accounts, by its identifier; empty is
  // of every one.
  string billing_account = 1;

  // How many to answer with: 20 when unset, and at most 100.
  int32 page_size = 2;

  // Where to carry on from: the `next_page_token` of the answer before.
  string page_token = 3;
}

message ListInvoicesResponse {
  // The latest first, without their lines: `GetInvoice` has those.
  repeated Invoice invoices = 1;

  string next_page_token = 2;
}

message GetInvoiceRequest {
  // The invoice, by its identifier.
  string id = 1;
}

message GetInvoiceResponse {
  // With its lines.
  Invoice invoice = 1;

  // Its credit notes, the earliest first.
  repeated CreditNote credit_notes = 2;

  // What is done of it since its charge failed: unset while it is in no
  // dunning -- none of its charges failed, or it is paid or void.
  Dunning dunning = 3;
}

message ListCreditNotesRequest {
  // Of one of the account's billing accounts; empty is of every one.
  string billing_account = 1;

  // Of one invoice; empty is of every one.
  string invoice = 2;
}

message ListCreditNotesResponse {
  // The earliest first.
  repeated CreditNote credit_notes = 1;
}

// PayerServiceListStatementsRequest is named for its service, as a request
// is whose method's name another service has too (`BillingService`'s
// `ListStatementsRequest`).
message PayerServiceListStatementsRequest {
  // Of one of the account's billing accounts, by its identifier; empty is
  // of every one. One that is not the account's is NotFound.
  string billing_account = 1;

  // How many to answer with: 20 when unset, and at most 100.
  int32 page_size = 2;

  // Where to carry on from: the `next_page_token` of the answer before.
  string page_token = 3;
}

message PayerServiceListStatementsResponse {
  // The latest period first, each with its lines.
  repeated Statement statements = 1;

  // What to ask for next, and empty when this was the last of them.
  string next_page_token = 2;
}

message PayerServiceGetStatementRequest {
  // The statement, by its identifier as text.
  string id = 1;
}

message PayerServiceGetStatementResponse {
  Statement statement = 1;
}

// Invoice is what a billing account is asked to pay for a product's period:
// every statement of the workspaces it paid for over the period, a line each.
// One that came to less than its channel collects waits for the next period,
// and is then the invoice of both. Once finalized it is never changed:
// what moves after is how it is settled, and a correction is a credit note.
//
// Every amount is a whole number of the currency's minor unit.
message Invoice {
  string id = 1;

  // The billing account it bills.
  string billing_account = 2;

  InvoiceState state = 3;

  // From the first moment it covers to the first after.
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp end = 5;

  Channel channel = 6;
  string currency = 7;

  // What its lines come to; a seller's tax on that, on a channel levyan
  // sells on itself (none on a merchant of record, whose tax is its own);
  // and the two.
  int64 subtotal = 8;
  int64 tax = 9;
  int64 total = 10;

  // What of the total the billing account's credit paid, and what was then
  // asked of the channel.
  int64 credited = 11;
  int64 due = 12;

  // What was paid of what was due, what credit notes took off it, and what
  // is left.
  int64 paid = 13;
  int64 reduced = 14;
  int64 remaining = 15;

  // Its number, on a channel levyan sells on itself, where it is the legal
  // invoice; 0 on a merchant of record's, which the MoR numbers itself.
  int64 number = 16;

  // When it was finalized, when it is due where its channel says one, and
  // when it was settled.
  google.protobuf.Timestamp finalized = 17;
  google.protobuf.Timestamp due_date = 18;
  google.protobuf.Timestamp settled = 19;

  // On a merchant of record, its invoice number once it collected.
  string channel_number = 20;

  // Its lines, in the order of their periods: in `GetInvoice`'s answer.
  repeated InvoiceLine lines = 21;

  // What paid `credited`, in `GetInvoice`'s answer: each credit an operator
  // granted that paid some of it, the soonest to expire first, and the
  // billing account's balance last.
  repeated InvoiceCredit credits = 22;
}

// InvoiceCredit is what of an invoice's total one credit paid, before
// anything was asked of its channel.
message InvoiceCredit {
  // The credit an operator granted (`Credit.id`), and empty for the billing
  // account's balance.
  string credit = 1;

  int64 amount = 2;

  // The workspace whose lines alone it paid, for a workspace's; and when it
  // expires.
  string workspace = 3;
  google.protobuf.Timestamp expires = 4;
}

// Credit is money an operator granted -- of a promotion, of a contract --
// taken off what is billed before the channel is asked for anything: to a
// billing account, the whole of it in one product, or to one workspace,
// whose lines alone it pays, on whichever billing account's invoice they
// are. It always expires, a year after it is granted unless the operator
// said, and nothing of it is spent once it has: credits that expire sooner
// are spent first.
message Credit {
  // Its identifier, as text.
  string id = 1;

  // The workspace it is granted to, and empty for a billing account's; and
  // the billing account it is granted to, and empty for a workspace's.
  string workspace = 2;
  string billing_account = 3;

  // How much was granted, and how much is left, in the currency's minor
  // unit.
  int64 granted = 4;
  int64 left = 5;
  string currency = 6;

  // When it expires, and when it was granted.
  google.protobuf.Timestamp expires = 7;
  google.protobuf.Timestamp created = 8;
}

// InvoiceState is where an invoice is, value for value levyan's own.
enum InvoiceState {
  INVOICE_STATE_UNSPECIFIED = 0;
  INVOICE_STATE_DRAFT = 1;
  INVOICE_STATE_OPEN = 2;
  INVOICE_STATE_PAID = 3;
  INVOICE_STATE_UNCOLLECTIBLE = 4;
  INVOICE_STATE_VOID = 5;
  INVOICE_STATE_WRITTEN_OFF = 6;

  // Shadow billing's, before collection on its channel began: never
  // collected, and never shown to a payer.
  INVOICE_STATE_SHADOW = 7;
}

// Dunning is what is done of an invoice its channel failed to collect
// (#11), by the deployment's policy table: a row for each kind of decline --
// its retries, its grace, when what the invoice bills is restricted, and when
// it is read-only. Each retry is a charge of its own through the same
// channel, and a charge is made as soon as the billing account is collectable
// again -- a payer who began a subscription anew, a payment that waited for
// them made -- whatever the row schedules. Once no retry is left and the
// grace is over the invoice is `INVOICE_STATE_UNCOLLECTIBLE`, still owed, and
// paid by the first charge of it that succeeds.
//
// Every time here is worked out from the invoice's charges as it is asked,
// and moves only as they do. It is what a product shows: the payer, what to
// do and by when; the members of the workspaces it bills, that they are to
// be restricted, and from when. levyan tells nobody itself (docs/apps.md).
message Dunning {
  // The invoice, by its identifier, and the billing account it bills.
  string invoice = 1;
  string billing_account = 2;

  // The kind of its latest decline, whose row of the table it is held to:
  // what the payer has to do. Unspecified is a refusal that says no more than
  // that it is one, or a failure that is no decline.
  DeclineKind kind = 3;

  // When its first charge failed: what every time below is measured from.
  google.protobuf.Timestamp failed = 4;

  // When it is charged next: a retry its row schedules, or the moment its
  // billing account became collectable again. One already past is due, and
  // is made at the deployment's next look (`dunning.every`, a minute). Unset
  // when no retry is to come: then it is charged as soon as its billing
  // account is collectable again, and never else -- a method to replace is
  // never tried again as it is.
  google.protobuf.Timestamp next_retry = 5;

  // When its grace ends, and from when what it bills -- every workspace of
  // its lines -- is restricted (`<product>.restricted`): as its grace ends,
  // or at once, from its first failure. It is restricted from then until it
  // is paid.
  google.protobuf.Timestamp grace_ends = 6;
  google.protobuf.Timestamp restricted_from = 7;

  // From when what it bills is read-only (`<product>.readonly`), the second
  // stage of its restriction: sixty days after its first failure, by
  // default, and never sooner than `restricted_from`. It is read-only from
  // then until it is paid, when both stages end at once.
  google.protobuf.Timestamp readonly_from = 8;
}

// DeclineKind is which kind of decline a payer's method refused a charge as,
// value for value levyan's own: what the policy table's row of it says
// follows.
enum DeclineKind {
  // A refusal that says no more than that it is one, or a failure that is no
  // decline.
  DECLINE_KIND_UNSPECIFIED = 0;

  // It may go through later on the same method.
  DECLINE_KIND_TEMPORARY = 1;

  // The method will not be charged as it is: another is needed -- none was
  // given, its subscription was canceled, or a payment waits for the payer
  // to act on it.
  DECLINE_KIND_REPLACE = 2;

  // Refused as suspected fraud, or blocked by a check of risk.
  DECLINE_KIND_FRAUD = 3;
}

// InvoiceLine is one statement on an invoice: what one workspace came to over
// one period.
message InvoiceLine {
  // The statement, by its identifier as `BillingService.GetStatement` takes
  // it, and `PayerService.GetStatement` for its payer.
  string statement = 1;

  // The workspace, as the product names it, and what the product called it
  // when the line was written.
  string workspace = 2;
  string label = 3;

  Period period = 4;

  // What the statement comes to.
  int64 total = 5;
}

// CreditNote takes some or all of a finalized invoice back: off what was
// still due first, then given back through the channel or kept as the
// billing account's credit, to be taken off its next invoices.
message CreditNote {
  string id = 1;
  string invoice = 2;

  CreditNoteReason reason = 3;

  // What it takes back of the invoice's subtotal, its tax, and the two.
  int64 amount = 4;
  int64 tax = 5;
  int64 total = 6;

  // Of its total: taken off what was due, given back, and credited.
  int64 reduced = 7;
  int64 refunded = 8;
  int64 credited = 9;

  // Its number, on a channel levyan sells on itself; 0 on any other.
  int64 number = 10;

  google.protobuf.Timestamp created = 11;
}

// CreditNoteReason is why a credit note takes back, value for value levyan's
// own.
enum CreditNoteReason {
  CREDIT_NOTE_REASON_UNSPECIFIED = 0;
  CREDIT_NOTE_REASON_CORRECTION = 1;
  CREDIT_NOTE_REASON_REFUND = 2;
  CREDIT_NOTE_REASON_CANCELLATION = 3;
}
