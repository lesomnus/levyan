edition = "2023";

// Who pays for a product's workspaces: the accounts of roster's that do, the
// billing accounts they pay with, and the offers that make somebody a payer.
package levyan.v1;

import "google/protobuf/timestamp.proto";
import "levyan/v1/invoice.proto";
import "levyan/v1/price_book.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/levyan/api/levyan/v1;levyanv1";

// PayerService is what a payer -- an account of roster's -- asks of levyan:
// the billing accounts it pays with, the offers to pay for a workspace, and
// the workspaces it pays for.
//
// # Who calls it
//
// A product, for one of its own users, as that user: the product's key, and
// the account it signed the user in as in the `levyan-account` header, the
// canonical text of the account's identifier at roster. The product vouches
// for the account -- levyan has signed nobody in -- and levyan asks roster
// whether the account is in good standing before it serves the call, and
// refuses one that is not. A call is the account's: what it reads and writes
// is its own billing accounts, and of the product that relays it, the offers
// made to it and the workspaces it pays for. Which product relays it says
// which product's workspaces are meant; a billing account is the account's in
// every product.
//
// A product's key without `levyan-account` is the product, which is refused
// every method here; and with it, the account, which is refused every method
// but these.
service PayerService {
  // ListBillingAccounts is the account's billing accounts, in the order it
  // made them.
  rpc ListBillingAccounts(ListBillingAccountsRequest) returns (ListBillingAccountsResponse);

  // CreateBillingAccount makes one: in a country, which says the channel it
  // is sold through and the currency it is billed in -- what the deployment
  // sells that country through as it is made -- and never changes.
  rpc CreateBillingAccount(CreateBillingAccountRequest) returns (CreateBillingAccountResponse);

  // UpdateBillingAccount says again who receives what one is billed, and the
  // business it is billed to. What is left out stays as it is.
  rpc UpdateBillingAccount(UpdateBillingAccountRequest) returns (UpdateBillingAccountResponse);

  // ListOffers is the offers made to the account to pay for a workspace of
  // the product's, not answered yet.
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);

  // Accept accepts one: the account pays for the workspace, with the billing
  // account it names or none yet, from the end of the period now open -- the
  // payer before it pays until then.
  rpc Accept(AcceptRequest) returns (AcceptResponse);

  // Decline declines one.
  rpc Decline(DeclineRequest) returns (DeclineResponse);

  // ListLinks is the workspaces of the product's the account pays for, or
  // will from the end of the period.
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse);

  // Use pays for a workspace the account pays for with another of its
  // billing accounts, from the end of the period now open.
  rpc Use(UseRequest) returns (UseResponse);

  // Stop stops paying for a workspace, as the period now open ends: from
  // then on it has no payer, unless somebody accepts first.
  rpc Stop(StopRequest) returns (StopResponse);

  // ListInvoices is the invoices of the account's billing accounts, of the
  // product's workspaces, once each is finalized: the latest first.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);

  // GetInvoice is one of them, with its lines and its credit notes.
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);

  // ListCreditNotes is the credit notes of them.
  rpc ListCreditNotes(ListCreditNotesRequest) returns (ListCreditNotesResponse);

  // GetBillingAccount is one of the account's billing accounts, with whether
  // what it is billed can be collected now, and the subscription it is
  // collected through on the merchant of record's channel.
  rpc GetBillingAccount(GetBillingAccountRequest) returns (GetBillingAccountResponse);

  // StartCheckout begins the subscription a billing account on the merchant
  // of record's channel is collected through: what a page opens the
  // merchant's checkout with, in which the payer gives the merchant a card --
  // never levyan, never the product -- and subscribes to the plan of the
  // billing account's currency.
  //
  // A billing account whose checkout was begun and not finished is answered
  // with that one again, while the merchant still takes it, so that a payer
  // who begins twice subscribes once. One that has a subscription, or is on
  // another channel, is refused (FailedPrecondition), and so is every one
  // while the deployment names no merchant of record.
  rpc StartCheckout(StartCheckoutRequest) returns (StartCheckoutResponse);

  // CompleteCheckout asks the merchant of record about a checkout of the
  // account's as the payer comes back from it: the subscription it started,
  // once it has, and the checkout open until then -- the payer may still be
  // in it, or the merchant still making the subscription, which a notice of
  // the merchant's completes all the same. Asked again, it answers the same.
  rpc CompleteCheckout(CompleteCheckoutRequest) returns (CompleteCheckoutResponse);
}

message ListBillingAccountsRequest {}

message ListBillingAccountsResponse {
  repeated BillingAccount billing_accounts = 1;
}

message CreateBillingAccountRequest {
  // What the account calls it: "회사용".
  string name = 1;

  // ISO 3166-1 alpha-2: KR. What a billing account in each country is sold
  // through and billed in is the deployment's to say: by default the
  // merchant of record, in won in KR and in US dollars anywhere else.
  string country = 2;

  Recipient recipient = 3;

  // For a business, what its tax invoice names it by.
  Business business = 4;
}

message CreateBillingAccountResponse {
  BillingAccount billing_account = 1;
}

message UpdateBillingAccountRequest {
  // The billing account, by its identifier.
  string id = 1;

  string name = 2 [features.field_presence = EXPLICIT];
  Recipient recipient = 3;
  Business business = 4;

  // Clears what is said of a business: the account is billed as a person.
  bool clear_business = 5;
}

message UpdateBillingAccountResponse {
  BillingAccount billing_account = 1;
}

message ListOffersRequest {}

message ListOffersResponse {
  repeated Offer offers = 1;
}

message AcceptRequest {
  // The offer, by its identifier.
  string offer = 1;

  // The billing account of the account's to pay with, by its identifier;
  // empty is none yet, when what the workspace comes to is priced on the
  // product's channel until one is used.
  string billing_account = 2;
}

message AcceptResponse {
  // The link the account pays by, from when it is in force.
  Link link = 1;
}

message DeclineRequest {
  string offer = 1;
}

message DeclineResponse {}

message ListLinksRequest {}

message ListLinksResponse {
  repeated Link links = 1;
}

message UseRequest {
  // The workspace: the canonical text of the identifier of the product's own
  // payday tenant.
  string workspace = 1;

  // The billing account of the account's to pay with from the end of the
  // period, by its identifier.
  string billing_account = 2;
}

message UseResponse {
  Link link = 1;
}

message StopRequest {
  string workspace = 1;
}

message StopResponse {
  // The link that ends, and when.
  Link link = 1;
}

message GetBillingAccountRequest {
  // The billing account, by its identifier.
  string id = 1;
}

message GetBillingAccountResponse {
  BillingAccount billing_account = 1;

  // Whether what it is billed can be collected now.
  Collection collection = 2;

  // The subscription it is collected through: its live one, or the last it
  // had; unset for none, and on a channel with no subscriptions.
  Subscription subscription = 3;
}

message StartCheckoutRequest {
  // The billing account it subscribes, by its identifier: one of the
  // account's, on the merchant of record's channel.
  string billing_account = 1;

  // Where the checkout sends the payer once they have finished: an absolute
  // URL of the product's, which then calls `CompleteCheckout`.
  string success_url = 2;
}

message StartCheckoutResponse {
  // The checkout, open, with what a page opens it with.
  Checkout checkout = 1;
}

message CompleteCheckoutRequest {
  // The checkout, by levyan's identifier of it (`Checkout.id`) and never the
  // merchant's: a checkout is completed only as levyan recorded it.
  string checkout = 1;
}

message CompleteCheckoutResponse {
  // The checkout as it is now: completed, still open, or canceled -- one the
  // merchant says can no longer be finished, after which another is begun.
  Checkout checkout = 1;

  // The subscription it started, once it has.
  Subscription subscription = 2;

  // Whether what the billing account is billed can be collected now.
  Collection collection = 3;
}

// Checkout is a checkout begun with a merchant of record.
message Checkout {
  string id = 1;
  string billing_account = 2;
  CheckoutState state = 3;

  google.protobuf.Timestamp started = 4;

  // When the merchant said it was finished, or that it never will be.
  google.protobuf.Timestamp done = 5;

  // What a page opens it with: answered by `StartCheckout`, and unset
  // elsewhere.
  CheckoutWindow window = 6;
}

// CheckoutState is where a checkout is, value for value levyan's own.
enum CheckoutState {
  CHECKOUT_STATE_UNSPECIFIED = 0;

  // Begun, and not finished.
  CHECKOUT_STATE_OPEN = 1;

  // Finished: the merchant made the subscription it started.
  CHECKOUT_STATE_COMPLETED = 2;

  // One the merchant says can no longer be finished: another is begun.
  CHECKOUT_STATE_CANCELED = 3;
}

// CheckoutWindow is what a page opens a merchant of record's checkout with:
// the merchant's script and what its SDK is called with -- a page that draws
// a checkout is written for the merchant whose checkout it draws -- or the
// merchant's own page for it, to send the payer to instead.
//
// For Paddle: load `script`; in the sandbox, `Paddle.Environment.set("sandbox")`
// first; then `Paddle.Initialize({token: client_token})` and
// `Paddle.Checkout.open({transactionId: transaction, settings: {successUrl}})`.
// Paddle shows Korean cards, KakaoPay and NaverPay only for a price in won to
// a customer with a Korean address: a page that has the payer's email may
// prefill both, `customer: {email, address: {countryCode: country}}`.
message CheckoutWindow {
  // The merchant of record, by the name of its adapter: "paddle".
  string merchant = 1;

  // "sandbox", where test cards move no money, or "production".
  string environment = 2;

  // The merchant's id of the checkout, which its SDK opens: Paddle's
  // transaction.
  string transaction = 3;

  // The client-side token the merchant's SDK is initialized with: public,
  // the checkout's, and no key.
  string client_token = 4;

  // The script the page loads.
  string script = 5;

  // The merchant's own page for it, to send the payer to instead.
  string url = 6;

  // The billing account's country, ISO 3166-1 alpha-2: what a page may
  // prefill the checkout's address with.
  string country = 7;
}

// Collection is whether what a billing account is billed can be collected
// now, and why not.
message Collection {
  CollectionState state = 1;

  // Since when it has been so.
  google.protobuf.Timestamp since = 2;

  // When the merchant of record will end, or pause, the subscription it is
  // collected through, as somebody scheduled it there -- the payer, in the
  // merchant's own pages, among them -- from when it is not collectable;
  // unset for nothing scheduled.
  google.protobuf.Timestamp ends = 3;
}

// CollectionState is whether what a billing account is billed can be
// collected now, and why not, value for value levyan's own.
enum CollectionState {
  // Nothing is said: a channel other than the merchant of record's, whose
  // collection is no subscription's -- a Korean PG, bank transfers.
  COLLECTION_STATE_UNSPECIFIED = 0;

  // Its subscription is billed and paid up.
  COLLECTION_STATE_COLLECTABLE = 1;

  // It has no subscription: the payer has not finished a checkout.
  COLLECTION_STATE_NO_SUBSCRIPTION = 2;

  // A payment the merchant has not collected, and is retrying.
  COLLECTION_STATE_PAST_DUE = 3;

  // Its subscription is paused.
  COLLECTION_STATE_PAUSED = 4;

  // Its subscription is over -- canceled at the merchant, by levyan or by
  // the payer -- and another checkout begins another.
  COLLECTION_STATE_CANCELED = 5;

  // A payment waits for the payer to act -- approve it in their card
  // company's app, or pass their bank's check.
  COLLECTION_STATE_NEEDS_ACTION = 6;
}

// Subscription is a subscription a merchant of record runs for a billing
// account, as levyan mirrors it from what the merchant's API answers.
message Subscription {
  string id = 1;

  // The merchant of record that runs it, by the name of its adapter.
  string merchant = 2;

  SubscriptionStatus status = 3;

  // What it is billed in.
  string currency = 4;

  // The billing period the merchant is in, and when it bills it next:
  // unset when it will not.
  google.protobuf.Timestamp period_start = 5;
  google.protobuf.Timestamp period_end = 6;
  google.protobuf.Timestamp next_billed = 7;

  // What the merchant will do to it, and when; unspecified for nothing.
  SubscriptionChange change = 8;
  google.protobuf.Timestamp change_at = 9;

  google.protobuf.Timestamp canceled = 10;

  // How the payer pays, as the newest payment levyan was told of says;
  // unset until one says.
  PaymentMethod method = 11;

  // When the merchant last changed it, by its own clock, and when levyan
  // last asked it.
  google.protobuf.Timestamp updated = 12;
  google.protobuf.Timestamp checked = 13;
}

// SubscriptionStatus is where a subscription is, value for value levyan's
// own.
enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_ACTIVE = 1;
  SUBSCRIPTION_STATUS_TRIALING = 2;
  SUBSCRIPTION_STATUS_PAST_DUE = 3;
  SUBSCRIPTION_STATUS_PAUSED = 4;
  SUBSCRIPTION_STATUS_CANCELED = 5;
}

// SubscriptionChange is what a merchant of record has scheduled of a
// subscription, value for value levyan's own.
enum SubscriptionChange {
  SUBSCRIPTION_CHANGE_UNSPECIFIED = 0;
  SUBSCRIPTION_CHANGE_CANCEL = 1;
  SUBSCRIPTION_CHANGE_PAUSE = 2;
  SUBSCRIPTION_CHANGE_RESUME = 3;
}

// PaymentMethod is how a payer pays, and never more of a card than this.
message PaymentMethod {
  // The merchant's name of the kind: card, south_korea_local_card,
  // kakao_pay, naver_pay, ….
  string type = 1;

  // A card's brand (visa) or its company (hyundai); empty for a method that
  // is no card.
  string brand = 2;

  // A card's last four digits.
  string last4 = 3;
}

// BillingAccount is what an account pays with.
message BillingAccount {
  string id = 1;
  string name = 2;

  // The country it is billed in, and what the deployment sold that country
  // through when it was made: the channel and the currency.
  string country = 3;
  Channel channel = 4;
  string currency = 5;

  Recipient recipient = 6;
  Business business = 7;

  google.protobuf.Timestamp created = 8;
}

// Recipient is who receives what a billing account is billed.
message Recipient {
  string name = 1;
  string email = 2;
  string address = 3;
}

// Business is the business a billing account is billed to: what a Korean tax
// invoice names it by.
message Business {
  // Its registration number: 123-45-67890.
  string registration = 1;
  string name = 2;
  string representative = 3;
  string address = 4;

  // What it does: its kind (업태) and its item (종목).
  string kind = 5;
  string item = 6;

  // Where its tax invoices go.
  string email = 7;
}

// Offer is a product asking an account to pay for one of its workspaces.
message Offer {
  string id = 1;

  // The workspace, as the product names it.
  string workspace = 2;

  // The account it is made to.
  string account = 3;

  google.protobuf.Timestamp offered = 4;
}

// Link is an account paying for a workspace, from when to when.
message Link {
  string id = 1;
  string workspace = 2;
  string account = 3;

  // The billing account it pays with; empty for none yet.
  string billing_account = 4;

  // In force from `start`, and until `end` when it says one.
  google.protobuf.Timestamp start = 5;
  google.protobuf.Timestamp end = 6;

  LinkBegan began = 7;
  LinkEnded ended = 8;
}

// LinkBegan is how a link began, value for value levyan's own.
enum LinkBegan {
  LINK_BEGAN_UNSPECIFIED = 0;
  LINK_BEGAN_ARRIVED = 1;
  LINK_BEGAN_ACCEPTED = 2;
  LINK_BEGAN_USED = 3;
  LINK_BEGAN_RESUMED = 4;
}

// LinkEnded is how a link ended, value for value levyan's own; unspecified
// while it lasts.
enum LinkEnded {
  LINK_ENDED_UNSPECIFIED = 0;
  LINK_ENDED_REPLACED = 1;
  LINK_ENDED_STOPPED = 2;
  LINK_ENDED_LEFT = 3;
  LINK_ENDED_SUSPENDED = 4;
  LINK_ENDED_ERASED = 5;
  LINK_ENDED_DESTROYED = 6;
}
