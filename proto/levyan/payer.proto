edition = "2023";

package levyan;

import "google/protobuf/empty.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/levyan";

// A payer is an account of roster's -- somebody who signs in once and pays
// for workspaces of any product levyan bills -- and calls levyan as itself, in
// no product's tenant (payday#184, #4). The account is roster's: levyan keeps
// its identifier and nothing else of it, beside what it was given to bill with
// (`BillingAccount`).
//
// payday asks an app with accounts which holder field names one. levyan's
// holders name none -- a product calls with a key and an operator through a
// door of their own, and a payer is in no tenant -- but the field is the
// declaration payday frames such a call by, so it is there.
option (payday.app) = {
  accounts: {
    field: {
      name: "account"
      number: 9
    }
  }
};

// PayerService is the methods an account calls as itself, as the schema
// declares them: so that payday frames such a call as the account and no
// tenant, holds it to these methods and no others, and has it read nothing
// through the walled servers but what the layer serving each said it reads
// (`pd.AccountReads`).
//
// It is a declaration, and nothing serves it. What a product calls, relaying
// its own user's call as theirs (`levyan-account`), is `levyan.v1`'s
// `PayerService` (api/), method for method by name, and each of those is
// served as the method of the same name here (`server/api`): the API is what
// was promised to the apps and names nothing of payday's, and this is what
// payday reads. A test holds the two to one another.
service PayerService {
  // The account's billing accounts.
  rpc ListBillingAccounts(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // A billing account of the account's, made.
  rpc CreateBillingAccount(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // Who receives what one of them is billed, and the business it is billed
  // to, said again.
  rpc UpdateBillingAccount(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // The offers to pay for a workspace of the product that relays the call,
  // made to the account and not answered.
  rpc ListOffers(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // An offer accepted: the account pays for the workspace from the next
  // period on.
  rpc Accept(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // An offer declined.
  rpc Decline(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // The workspaces of the product that relays the call the account pays for,
  // or will from the next period.
  rpc ListLinks(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // Another of the account's billing accounts used for a workspace it pays
  // for, from the next period on.
  rpc Use(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // The account stops paying for a workspace, as the period ends.
  rpc Stop(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // The invoices of the account's billing accounts, of the product that
  // relays the call, once each is finalized (#9).
  rpc ListInvoices(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // One of them, with its lines and its credit notes.
  rpc GetInvoice(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }

  // The credit notes of them.
  rpc ListCreditNotes(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (payday.method) = {account: {}};
  }
}
