edition = "2023";
package levyan;

import "google/protobuf/timestamp.proto";
import "levyan/billing_account_svc.g.proto";
import "levyan/subscription.proto";
import "patch/patch.proto";

option go_package = "github.com/lesomnus/levyan";

service SubscriptionService {
  // Add creates a new Subscription
  rpc Add(SubscriptionAddRequest) returns (Subscription);
  // Get retrieves a Subscription
  rpc Get(SubscriptionGetRequest) returns (Subscription);
  // Patch updates an existing Subscription
  rpc Patch(SubscriptionPatchRequest) returns (Subscription);
  // Apply applies a patch document to an existing Subscription
  rpc Apply(SubscriptionApplyRequest) returns (Subscription);
  // List reads Subscriptions a page at a time.
  rpc List(SubscriptionListRequest) returns (SubscriptionListResponse);
}

message SubscriptionAddRequest {
  bytes id = 1;
  BillingAccountRef billing_account = 8;
  string mor = 9 [features.field_presence = IMPLICIT];
  string mor_subscription = 10 [features.field_presence = IMPLICIT];
  string mor_customer = 11 [features.field_presence = IMPLICIT];
  SubscriptionStatus status = 12 [features.field_presence = IMPLICIT];
  string currency = 16 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_period_start = 17;
  google.protobuf.Timestamp date_period_end = 18;
  google.protobuf.Timestamp date_next = 19;
  SubscriptionChange change = 20 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_change = 21;
  google.protobuf.Timestamp date_canceled = 22;
  string method_type = 23 [features.field_presence = IMPLICIT];
  string method_brand = 24 [features.field_presence = IMPLICIT];
  string method_last4 = 25 [features.field_presence = IMPLICIT];
  string last_transaction = 26 [features.field_presence = IMPLICIT];
  int32 last_progress = 27 [features.field_presence = IMPLICIT];
  bool awaiting_payer = 28 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_mor_updated = 29;
  google.protobuf.Timestamp date_checked = 30;
  google.protobuf.Timestamp date_created = 15;
}

message SubscriptionGetRequest {
  SubscriptionRef ref = 1;
  SubscriptionSelect select = 2;
}

message SubscriptionRef {
  oneof key {
    bytes id = 1;
    SubscriptionRefByMorSubscription mor_subscription = 9;
  }
}

message SubscriptionRefByMorSubscription {
  string mor = 9;
  string mor_subscription = 10;
}

message SubscriptionSelect {
  bool all = 1;
  BillingAccountSelect billing_account = 8;
  bool mor = 9;
  bool mor_subscription = 10;
  bool mor_customer = 11;
  bool status = 12;
  bool currency = 16;
  bool date_period_start = 17;
  bool date_period_end = 18;
  bool date_next = 19;
  bool change = 20;
  bool date_change = 21;
  bool date_canceled = 22;
  bool method_type = 23;
  bool method_brand = 24;
  bool method_last4 = 25;
  bool last_transaction = 26;
  bool last_progress = 27;
  bool awaiting_payer = 28;
  bool date_mor_updated = 29;
  bool date_checked = 30;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message SubscriptionPatchRequest {
  SubscriptionRef ref = 1;
  string mor_customer = 22;
  SubscriptionStatus status = 24;
  string currency = 32;
  google.protobuf.Timestamp date_period_start = 34;
  // Clear date_period_start instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_period_start clears.
  bool date_period_start_null = 35;
  google.protobuf.Timestamp date_period_end = 36;
  // Clear date_period_end instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_period_end clears.
  bool date_period_end_null = 37;
  google.protobuf.Timestamp date_next = 38;
  // Clear date_next instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_next clears.
  bool date_next_null = 39;
  SubscriptionChange change = 40;
  google.protobuf.Timestamp date_change = 42;
  // Clear date_change instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_change clears.
  bool date_change_null = 43;
  google.protobuf.Timestamp date_canceled = 44;
  // Clear date_canceled instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_canceled clears.
  bool date_canceled_null = 45;
  string method_type = 46;
  string method_brand = 48;
  string method_last4 = 50;
  string last_transaction = 52;
  int32 last_progress = 54;
  bool awaiting_payer = 56;
  google.protobuf.Timestamp date_mor_updated = 58;
  google.protobuf.Timestamp date_checked = 60;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
}

message SubscriptionApplyRequest {
  SubscriptionRef ref = 1;
  patch.Patch patch = 2;
}

message SubscriptionListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated SubscriptionFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message SubscriptionListResponse {
  repeated Subscription items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message SubscriptionFilter {
  SubscriptionRef ref = 1;
  BillingAccountRef billing_account = 2;
}
