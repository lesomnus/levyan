edition = "2023";

// What a product says of its workspaces: a workspace made, an account gone
// from one, an account asked to pay for one -- and a workspace closed,
// restored and destroyed, which is when it is billed and when not.
package levyan.v1;

import "google/protobuf/timestamp.proto";
import "levyan/v1/invoice.proto";
import "levyan/v1/payer.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/levyan/api/levyan/v1;levyanv1";

// WorkspaceService is what a product tells levyan of who pays for its
// workspaces, and asks of it. Every call is the calling product's own, as
// `PriceBookService`'s are, and every workspace is the canonical text of the
// identifier of the product's own payday tenant; every account is roster's.
service WorkspaceService {
  // Arrive says a workspace was made, and by whom: its creator is its payer
  // from when it was made, with the first billing account they made, if they
  // have made one. Said again, it changes nothing but its label.
  rpc Arrive(ArriveRequest) returns (ArriveResponse);

  // Leave says an account is no longer in a workspace. If it paid for the
  // workspace, the workspace has no payer from now; what was offered to it is
  // withdrawn. Said again, it changes nothing.
  rpc Leave(LeaveRequest) returns (LeaveResponse);

  // Offer asks an account to pay for a workspace, which it answers as itself
  // (`PayerService/Accept`). It withdraws what was offered before.
  rpc Offer(OfferRequest) returns (OfferResponse);

  // GetPayer is who pays for a workspace now and next, what is offered, and
  // since when it has had no payer.
  rpc GetPayer(GetPayerRequest) returns (GetPayerResponse);

  // Close says a workspace was closed at `at`: from then, while nothing
  // restores it, it is no customer, and what it holds is billed for none of
  // that stretch. Its readings are still sent, and kept. Its payer stays its
  // payer.
  //
  // Close, Restore and Destroy are each said once of a moment: said again,
  // they change nothing. They are put in the order of their moments, never of
  // their coming, so one sent late takes its place and an older one never
  // undoes what a newer one says; and one that comes after a period it
  // reaches into was closed is corrected on a later statement, as a late
  // reading is. `at` is never ahead of now, nor before the workspace arrived
  // (InvalidArgument); a workspace levyan has heard nothing of -- no Arrive,
  // no reading -- has nothing to close (NotFound); and another thing said of
  // a moment one was said of already is refused (FailedPrecondition).
  rpc Close(CloseRequest) returns (CloseResponse);

  // Restore says a closed workspace was opened again at `at`: it is billed
  // for the stretch it was closed for, as for any open time, and from then
  // on as it was before it was closed. What a period closed since its close
  // was billed without that stretch is corrected on a later statement: a
  // restore reaches back to the close it ends.
  rpc Restore(RestoreRequest) returns (RestoreResponse);

  // Destroy says a workspace was destroyed at `at`, for good: it is billed
  // for nothing after it -- nor for the stretch it was closed for, if it was
  // closed -- its last reading holds to that moment and no further, its
  // payer pays for it no longer (`LINK_ENDED_DESTROYED`), and what was
  // offered of it is withdrawn. A reading measured at `at` or after is
  // refused (`REFUSAL_DESTROYED`), and so is a close or a restore said of its
  // moment or after it (FailedPrecondition). Its final reading, measured
  // before it went, is sent first.
  rpc Destroy(DestroyRequest) returns (DestroyResponse);

  // GetLifecycle is what levyan has been told became of a workspace: what a
  // product reads to see that what it said was heard.
  rpc GetLifecycle(GetLifecycleRequest) returns (GetLifecycleResponse);
}

message ArriveRequest {
  string workspace = 1;

  // Its creator: the canonical text of their account's identifier at roster.
  string creator = 2;

  // When it was made; unset is now. Never after now, and what a workspace
  // made before levyan heard of it is billed from.
  google.protobuf.Timestamp created = 3;

  // What the product calls it, for an invoice to name it by: its name
  // there, at most 100 characters. Said again, it is what the workspace is
  // called from then on; an invoice keeps what each of its lines was written
  // with. Empty leaves it as it was.
  string label = 4;
}

message ArriveResponse {
  Payer payer = 1;
}

message LeaveRequest {
  string workspace = 1;
  string account = 2;
}

message LeaveResponse {
  Payer payer = 1;
}

message OfferRequest {
  string workspace = 1;
  string account = 2;
}

message OfferResponse {
  Offer offer = 1;
}

message GetPayerRequest {
  string workspace = 1;
}

message GetPayerResponse {
  Payer payer = 1;
}

message CloseRequest {
  string workspace = 1;

  // When it was closed, as the product's own record of it says: required.
  google.protobuf.Timestamp at = 2;
}

message CloseResponse {
  Lifecycle lifecycle = 1;

  // Whether what was said came late: it reaches into a period whose close
  // had begun, so that what the period was billed is corrected on a later
  // statement. A restore, or a destruction, of a workspace closed reaches
  // back to the close of the stretch it ends, and is late, however soon it
  // is said, when that close is in a period whose close had begun. False
  // for what was said before, and changed nothing.
  bool late = 2;
}

message RestoreRequest {
  string workspace = 1;

  // When it was opened again: required.
  google.protobuf.Timestamp at = 2;
}

message RestoreResponse {
  Lifecycle lifecycle = 1;

  // As `CloseResponse.late`.
  bool late = 2;
}

message DestroyRequest {
  string workspace = 1;

  // When it was destroyed -- after its final reading was measured: required.
  google.protobuf.Timestamp at = 2;
}

message DestroyResponse {
  Lifecycle lifecycle = 1;

  // As `CloseResponse.late`.
  bool late = 2;
}

message GetLifecycleRequest {
  string workspace = 1;
}

message GetLifecycleResponse {
  Lifecycle lifecycle = 1;
}

// Lifecycle is what levyan has been told became of a workspace, all of it
// read in the order of its moments. A workspace nothing was said of is open.
message Lifecycle {
  string workspace = 1;

  // Since when it has been closed, and is billed for nothing while it is;
  // unset while it is open. A workspace destroyed while closed says the
  // closure it was destroyed in.
  google.protobuf.Timestamp closed_since = 2;

  // When it was destroyed, for good; unset for one that was not.
  google.protobuf.Timestamp destroyed = 3;
}

// Payer is who pays for a workspace.
message Payer {
  string workspace = 1;

  // Who pays now, unset when nobody does; and who will from the end of the
  // period, unset when that is who pays now, or nobody.
  Link current = 2;
  Link next = 3;

  // What is offered and not answered.
  Offer offer = 4;

  // Since when it has had nobody paying for it, and from when it is
  // restricted for that: as the deployment's policy table says of a
  // workspace with no payer (`dunning.kinds.payerless`) -- thirty days after,
  // by default, or at once -- and from when it is read-only for it, the
  // second stage (`readonly_from`, below): sixty days after, by default.
  // Unset while it has a payer, for a workspace that never had one, and for
  // one destroyed, which nobody pays for and nothing restricts.
  google.protobuf.Timestamp payerless_since = 5;
  google.protobuf.Timestamp restricted_from = 6;

  // Whether what the billing account it is paid for with now is billed can
  // be collected, and why not: what a product warns its owners of. Unset
  // while nobody pays for it, or its payer has set up no billing account
  // yet. How the payer pays is the payer's to see (`PayerService`), and not
  // here.
  Collection collection = 7;

  // The invoices still owed that bill this workspace -- of the billing
  // account it is paid for with now, or of one that paid for it before --
  // whose charge failed, each with what is done of it: when it is charged
  // next, and from when it restricts the workspace, the one that restricts
  // soonest first. Empty while there is none. Restricted by either -- an
  // invoice, or having no payer -- the workspace is restricted, by one key
  // (`<product>.restricted`), until neither restricts it; and read-only, by
  // another (`<product>.readonly`), until neither makes it so.
  repeated Dunning dunning = 8;

  // From when it is read-only for having had nobody paying for it, beside
  // `restricted_from`: as the policy table's row of a workspace with no payer
  // says, sixty days after `payerless_since` by default, and never sooner
  // than it is restricted. Unset when `payerless_since` is.
  google.protobuf.Timestamp readonly_from = 9;
}
