edition = "2023";

package levyan;

import "levyan/meter.proto";
import "levyan/payday/tenant.proto";
import "levyan/workspace.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/levyan";

// Series is one stream of a flow: what one process of a product counted of one
// flow meter for one workspace, as an OpenTelemetry Sum, monotonic and
// cumulative, exported to levyan's receiver (`server/otlp`).
//
// What a stream is, is what OpenTelemetry says it is: the resource it came
// from, the scope that made it, and the attributes of its points -- the
// workspace's `payday.tenant` among them. Two of them are two series however
// alike their numbers, and each is added up on its own: every point is the
// whole count since its start, so a series' increase over a period is its
// own, and the meter's is theirs added (`internal/rating`).
//
// Written the first time a point of it comes, and never changed: the points
// are what grows.
message Series {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // The product that exported it.
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // The workspace it counts for: its points' `payday.tenant`.
  Workspace workspace = 3 [(orm.edge) = {immutable: true}];

  // What it counts: a flow meter of the product, by the Sum's name.
  Meter meter = 8 [(orm.edge) = {immutable: true}];

  // Which stream it is: the SHA-256 of its resource's attributes, its scope's
  // name and version, the Sum's name and its points' attributes, written in
  // an order of their own (`server/otlp`). What a stream carries is not kept
  // -- a resource may say a process's command line -- only that it is the same
  // one again.
  bytes digest = 9 [(orm.field) = {immutable: true}];

  // Where it came from, for an operator telling series apart: the resource's
  // `service.name` and `service.instance.id`, as said. Nothing else of the
  // resource is kept.
  string source = 10 [
    (orm.field) = {immutable: true},
    (payday.field) = {personal: false}
  ];

  // Never stamped: there is no Erase.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  // When its first point came.
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    // Patch is generated though nothing here may change -- every field is
    // immutable -- because protobuf-orm writes `<Entity>GetKey`, which an
    // edge to this entity is resolved by, only beside a Patch. No caller is
    // given it (`server/policy`).
    rpc: {
      crud: true
      erase: {disabled: true}
    }
    indexes: [
      {
        name: "page"
        refs: [
          {
            name: "tenant"
            number: 2
          },
          {
            name: "date_created"
            number: 15
          },
          {
            name: "id"
            number: 1
          }
        ]
      },
      {
        name: "stream"
        refs: [
          {
            name: "tenant"
            number: 2
          },
          {
            name: "digest"
            number: 9
          }
        ]
        unique: true
      },
      {
        // A workspace's series of a meter, which a period adds up.
        name: "counted"
        refs: [
          {
            name: "workspace"
            number: 3
          },
          {
            name: "meter"
            number: 8
          }
        ]
      }
    ]
  };
  option (payday.entity) = {
    domain: 14
    tenanted: {
      via: "tenant"
      agrees: [
        "workspace.tenant",
        "meter.tenant"
      ]
    }
    list: {
      order: [
        {field: {name: "date_created"}},
        {field: {name: "id"}}
      ]
      by: [{name: "ref"}]
      size: 100
      max: 1000
    }
  };
}
